name: Bug report
description: Report a defect (never include live secrets)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include client keys, bot tokens, chat IDs, or message text.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps with placeholders only
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NodeGram version / commit
    validations:
      required: true
