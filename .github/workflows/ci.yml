name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: node scripts/secret-scan.mjs
      - name: Verify bundle exports main
        run: |
          node -e "const m=require('./packages/nodegram/gateway/bundle.js'); if(typeof m.main!=='function'){console.error('main missing'); process.exit(1)}"
