name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create release notes for (documentation only; no deploy)"
        required: false

permissions:
  contents: write

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Create GitHub Release (no deploy)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          body: |
            ## NodeGram release

            This workflow publishes GitHub release notes only.
            It does **not** deploy to DigitalOcean.

            Deploy manually after review:

            ```bash
            npm ci && npm run check
            ./scripts/deploy.sh
            ```

            See docs/deployment-digitalocean.md.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
