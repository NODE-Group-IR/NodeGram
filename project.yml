packages:
  - name: nodegram
    functions:
      - name: gateway
        runtime: nodejs:22
        web: raw
        main: main
        limits:
          timeout: 30000
          memory: 256
          logs: 32
        environment:
          NODEGRAM_CLIENTS_B64: "${NODEGRAM_CLIENTS_B64}"
          NODEGRAM_REQUEST_TIMEOUT_MS: "${NODEGRAM_REQUEST_TIMEOUT_MS}"
          NODEGRAM_MAX_BODY_BYTES: "${NODEGRAM_MAX_BODY_BYTES}"
          NODEGRAM_ALLOWED_ORIGINS: "${NODEGRAM_ALLOWED_ORIGINS}"
          NODEGRAM_BURST: "${NODEGRAM_BURST}"
          NODEGRAM_REFILL_PER_SECOND: "${NODEGRAM_REFILL_PER_SECOND}"
          NODEGRAM_LOG_BOT_ALIAS: "${NODEGRAM_LOG_BOT_ALIAS}"
          NODEGRAM_BUILD_ID: "${NODEGRAM_BUILD_ID}"
